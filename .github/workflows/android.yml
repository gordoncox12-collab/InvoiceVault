name: Android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon
      - name: Package named APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk InvoiceVault-debug.apk
          file InvoiceVault-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: InvoiceVault-debug
          path: InvoiceVault-debug.apk
      - name: Release APK on tags
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: InvoiceVault-debug.apk
          generate_release_notes: true
