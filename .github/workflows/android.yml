name: Android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Accept Android SDK licences
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SM="$(find "$SDK/cmdline-tools" -type f -name sdkmanager | head -1)"
          echo "sdkmanager=$SM"
          yes | "$SM" --licenses || true
      - name: Unit tests and debug APK
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon
      - name: Write signing config when secrets are present
        id: signing
        if: startsWith(github.ref, 'refs/tags/')
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_PASSWORD" ] && [ -f app/play-upload.jks ]; then
            {
              echo "storeFile=app/play-upload.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=${KEY_ALIAS:-upload}"
              echo "keyPassword=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            } > keystore.properties
            echo "has_signing=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_signing=false" >> "$GITHUB_OUTPUT"
            echo "No KEYSTORE_PASSWORD secret — skipping signed Play artefacts (use locally signed GitHub Release)."
          fi
      - name: Release bundle and APK
        if: startsWith(github.ref, 'refs/tags/') && steps.signing.outputs.has_signing == 'true'
        run: |
          ./gradlew :app:bundleRelease :app:assembleRelease --no-daemon
          cp app/build/outputs/bundle/release/app-release.aab InvoiceVault.aab
          cp app/build/outputs/apk/release/app-release.apk InvoiceVault-release.apk
          file InvoiceVault.aab InvoiceVault-release.apk
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/') && steps.signing.outputs.has_signing == 'true'
        with:
          name: InvoiceVault-play
          path: |
            InvoiceVault.aab
            InvoiceVault-release.apk
      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/') && steps.signing.outputs.has_signing == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            InvoiceVault.aab
            InvoiceVault-release.apk
          generate_release_notes: true
          body: |
            Play upload AAB and signed release APK for InvoiceVault.
            Sideload: InvoiceVault-release.apk (public, no login).
            Play Console: InvoiceVault.aab — see PLAY_STORE.md.
          make_latest: true
